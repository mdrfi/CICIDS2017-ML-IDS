[project]
name = "cicids2017-ml-ids"
version = "0.1.0"
description = "Notebook-based CIC-IDS2017 intrusion detection and attack classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "tqdm>=4.67",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1", "seaborn>=0.13"]
explainability = ["shap>=0.46"]

[tool.uv]
package = false
